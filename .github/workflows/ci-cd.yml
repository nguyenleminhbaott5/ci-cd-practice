# ============================================================
# WORKFLOW = 1 file YAML mô tả một quy trình tự động.
# GitHub tự đọc mọi file trong thư mục .github/workflows/
# (thư mục này BẮT BUỘC nằm ở gốc repo, đúng tên).
# ============================================================

# Tên hiển thị ở tab "Actions" trên GitHub (không ảnh hưởng logic).
name: CI/CD

# ------------------------------------------------------------
# on = EVENT: khi nào workflow được kích hoạt.
# ------------------------------------------------------------
on:
  push:
    branches: [main]   # chạy khi có người push lên nhánh main
  pull_request:        # chạy khi mở/cập nhật Pull Request (mọi nhánh đích)
                       # -> nhờ vậy code lỗi bị phát hiện TRƯỚC khi merge

# ------------------------------------------------------------
# permissions: quyền của GITHUB_TOKEN (token GitHub tự cấp cho mỗi lần chạy).
# "contents: read" = chỉ được đọc code, không được ghi/push gì cả.
# Nguyên tắc: cấp quyền tối thiểu, cần gì thêm thì khai báo sau.
# ------------------------------------------------------------
permissions:
  contents: read

# ------------------------------------------------------------
# jobs: danh sách công việc.
# - Mỗi job chạy trên 1 máy ảo MỚI và SẠCH, xong là bị xóa.
# - Mặc định các job chạy SONG SONG; muốn chạy lần lượt thì dùng "needs"
#   (sẽ dùng ở Bài 2: build cần check, deploy cần build).
# ------------------------------------------------------------
jobs:
  # "check" là tên job do mình đặt. Tên này cũng là tên "status check"
  # mà bạn chọn khi bật branch protection (chặn merge khi đỏ).
  check:
    # runs-on = loại máy ảo GitHub cấp cho job này (Ubuntu mới nhất).
    runs-on: ubuntu-latest

    # steps = các bước, chạy TUẦN TỰ trong cùng 1 máy ảo (thấy file của nhau).
    # Một step thoát với mã khác 0 => cả job dừng và hiện dấu đỏ.
    steps:
      # Step 1 - "uses" = dùng một action viết sẵn của người khác.
      # actions/checkout tải code repo về máy ảo.
      # Máy ảo mới tinh và RỖNG, không checkout thì không có index.html để kiểm tra.
      - uses: actions/checkout@v4

      # Step 2 - cài Node.js, vì công cụ html-validate là gói npm.
      # "with" = truyền tham số cho action.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3 - "run" = chạy một lệnh shell; "name" chỉ để hiển thị trong log.
      # npx --yes : tải và chạy html-validate luôn, không hỏi xác nhận.
      # "*.html"  : kiểm tra mọi file .html ở thư mục gốc.
      # Luật kiểm tra lấy từ file .htmlvalidate.json.
      # Có lỗi HTML => lệnh thoát mã khác 0 => job đỏ.
      - name: Validate HTML
        run: npx --yes html-validate "*.html"

  # ==========================================================
  # BÀI 2 - job "build": đóng gói Docker image, test thử, đẩy lên GHCR.
  # GHCR = GitHub Container Registry, "kho" lưu image của GitHub.
  # ==========================================================
  build:
    # needs = chạy SAU job check và chỉ khi check xanh.
    # Check đỏ => build bị bỏ qua, code lỗi không bao giờ được đóng gói.
    needs: check
    runs-on: ubuntu-latest

    # Quyền riêng của job này (ghi đè khối permissions ở trên).
    # packages: write = được đẩy image lên GHCR. Chỉ job build cần quyền này.
    permissions:
      contents: read
      packages: write

    steps:
      # Job mới = máy ảo mới và rỗng => phải checkout lại code.
      - uses: actions/checkout@v4

      # Đặt biến môi trường IMAGE dùng cho các step sau.
      # ${GITHUB_REPOSITORY,,} = "owner/repo" chuyển hết sang chữ THƯỜNG
      # (Docker từ chối tên image có chữ hoa).
      # Ghi vào $GITHUB_ENV thì các step sau mới đọc được biến này.
      - name: Đặt tên image (bắt buộc chữ thường)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Build image từ Dockerfile ở thư mục gốc (dấu "." ở cuối).
      # Tag = github.sha (mã commit): mỗi commit có 1 image riêng,
      # biết chính xác bản nào đang chạy và rollback được về SHA cũ.
      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # Smoke test: chạy thử container và gọi trang chủ.
      # Build thành công chưa chắc trang chạy đúng (thiếu file, sai đường dẫn...).
      - name: Smoke test
        run: |
          # -d chạy nền; map cổng 8080 của máy ảo -> cổng 80 của container
          docker run -d --name site -p 8080:80 "$IMAGE:${{ github.sha }}"
          # chờ vài giây cho nginx khởi động
          sleep 3
          # -f: HTTP lỗi (404, 500...) thì curl thoát mã khác 0 => step đỏ
          # ghi ra file rồi mới grep (tránh lỗi exit 23 khi pipe curl | grep -q)
          curl -fsS http://localhost:8080/ -o out.html
          # kiểm tra trang có đúng nội dung mong đợi, không thì step đỏ
          grep -q "Xin chào CI/CD" out.html

      # Chỉ đăng nhập + đẩy image khi push lên main.
      # Pull Request vẫn build và test, nhưng không làm bẩn registry.
      - name: Đăng nhập GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}              # người push
          password: ${{ secrets.GITHUB_TOKEN }}      # token tự cấp, không cần tạo tay

      # Gắn thêm tag "latest" (tiện dùng) rồi đẩy cả 2 tag lên GHCR.
      # Đừng chỉ dựa vào latest: nó luôn đổi, không biết đang chạy bản nào.
      - name: Đẩy image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ==========================================================
  # BÀI 4 - job "deploy": tự động hóa đúng những gì đã làm tay ở Bài 3
  # (scripts/manual-deploy.sh). Đây là phần CD (Continuous Deployment).
  # ==========================================================
  deploy:
    # Chỉ chạy khi build xanh (image đã nằm trên GHCR).
    needs: build
    # Chỉ deploy khi push lên main. Pull Request chỉ chạy check + build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Job này đọc secrets/variables của environment "coder-staging"
    # (CODER_URL, CODER_SESSION_TOKEN, CODER_WORKSPACE đã tạo trên GitHub).
    # Job khác không khai báo environment này thì KHÔNG đọc được secrets đó.
    environment: coder-staging

    # Không để 2 lần deploy chạy chồng nhau.
    # cancel-in-progress: false = lần sau CHỜ lần trước xong, không hủy giữa chừng.
    concurrency:
      group: deploy-coder
      cancel-in-progress: false

    # Coder CLI tự đọc 2 biến CODER_URL và CODER_SESSION_TOKEN để đăng nhập,
    # nên không cần chạy "coder login".
    env:
      CODER_URL: ${{ secrets.CODER_URL }}
      CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
      WORKSPACE: ${{ vars.CODER_WORKSPACE }}

    steps:
      # Job mới = máy ảo mới: không có code, nên KHÔNG cần checkout
      # (deploy chỉ cần tên image, image đã có sẵn trên GHCR).

      - name: Đặt tên image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Cài Coder CLI từ chính server Coder của bạn => luôn đúng phiên bản server.
      # (CLI lệch phiên bản server thì nhiều lệnh báo lỗi "version mismatch".)
      - name: Cài Coder CLI (khớp phiên bản server)
        run: curl -fsSL "$CODER_URL/install.sh" | sh

      # Vào workspace, kéo image đúng SHA của commit vừa build, thay container cũ.
      # --wait=yes : chờ workspace khởi động xong rồi mới chạy lệnh.
      # Image đã public nên không cần docker login.
      # "docker rm -f site || true" : xóa container cũ, không lỗi nếu chưa có.
      - name: Deploy vào workspace
        run: |
          coder ssh --wait=yes "$WORKSPACE" \
            "docker pull $IMAGE:${{ github.sha }} && (docker rm -f site || true) && docker run -d --name site --restart unless-stopped -p 8080:80 $IMAGE:${{ github.sha }}"

      # Kiểm tra SAU deploy: pipeline xanh phải nghĩa là trang thật sự đang chạy,
      # không chỉ là lệnh deploy không báo lỗi.
      - name: Kiểm tra sau deploy
        run: |
          sleep 3
          coder ssh "$WORKSPACE" \
            "curl -fsS http://localhost:8080/ -o /tmp/out.html && grep -q 'Xin chào CI/CD' /tmp/out.html"
